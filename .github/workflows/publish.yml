# Harvests fresh metadata, runs all tests, builds the static app and publishes it to GitHub Pages.
name: harvest-and-publish
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # every Monday
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pipeline tests
        working-directory: pipeline
        run: pip install -r requirements-dev.txt && pytest -q
      - name: Harvest and build the data
        working-directory: pipeline
        run: python -m metalens.pipeline --out ../web/public/data --since "$(date -u -d '45 days ago' +%F)" --limit 400
      - name: Build and test the web app
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /metadata-lens
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm ci && npm run typecheck && npm test && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
